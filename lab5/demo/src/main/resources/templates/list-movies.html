<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>КіноПортал - Список фільмів</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .movie-img {
            width: 100px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .table {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .table th {
            background-color: #343a40;
            color: white;
            padding: 15px;
        }
        .table td {
            padding: 15px;
        }
        .btn-action {
            margin: 2px;
        }
        .page-header {
            margin-top: 40px;
            margin-bottom: 40px;
            text-align: center;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/movies">🎬 КіноПортал</a>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1 class="display-5 fw-bold text-primary mb-3">Список фільмів</h1>
        <p class="lead text-muted">Ваша улюблена колекція кіно</p>
    </div>

    <div class="d-flex justify-content-end mb-4">
        <a th:href="@{/movies/new}" class="btn btn-success btn-lg shadow-sm">
            + Додати новий фільм
        </a>
    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th width="5%">ID</th>
                <th width="15%">Постер</th>
                <th width="20%">Назва</th>
                <th width="45%">Опис</th>
                <th width="15%" class="text-center">Дії</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${movies}">
                <td th:text="${movie.id}" class="fw-bold">1</td>
                <td>
                    <img th:if="${movie.imageUrl != null and !movie.imageUrl.isEmpty()}" th:src="${movie.imageUrl}" alt="Постер" class="movie-img"/>
                    <span th:unless="${movie.imageUrl != null and !movie.imageUrl.isEmpty()}" class="badge bg-secondary">Немає фото</span>
                </td>
                <td th:text="${movie.name}" class="fs-5 text-dark fw-semibold">Назва фільму</td>
                <td th:text="${movie.description}">Опис фільму</td>
                <td class="text-center">
                    <div class="d-flex flex-column align-items-center">
                        <a th:href="@{/movies/edit/{id}(id=${movie.id})}" class="btn btn-primary btn-sm btn-action shadow-sm w-100 mb-2">Редагувати</a>
                        <a th:href="@{/movies/delete/{id}(id=${movie.id})}" class="btn btn-danger btn-sm btn-action shadow-sm w-100"
                           onclick="return confirm('Ви впевнені, що хочете видалити цей фільм?');">Видалити</a>
                    </div>
                </td>
            </tr>
            <tr th:if="${movies.empty}">
                <td colspan="5" class="text-center text-muted py-5 fs-5">Немає жодного фільму. Додайте свій перший фільм!</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
