<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>КіноПортал - Форма фільму</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 40px;
            margin-top: 40px;
            margin-bottom: 50px;
        }
        .form-title {
            color: #212529;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/movies">🎬 КіноПортал</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/movies">Повернутися до списку</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="form-container">
                <h2 class="form-title" th:text="${movie.id == null ? 'Додати новий фільм' : 'Редагувати фільм'}">Додати фільм</h2>

                <form action="#" th:action="@{/movies/save}" th:object="${movie}" method="post">
                    
                    <!-- Приховане поле для ID (потрібно для оновлення) -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-4">
                        <label for="name" class="form-label">Назва фільму</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control form-control-lg" placeholder="Введіть назву фільму" required />
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Опис</label>
                        <textarea id="description" th:field="*{description}" class="form-control form-control-lg" rows="4" placeholder="Короткий опис сюжету..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="imageUrl" class="form-label">URL-адреса постера (картинки)</label>
                        <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control form-control-lg" placeholder="https://example.com/poster.jpg" />
                        <div class="form-text">Вставте посилання на зображення з інтернету</div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                        <a th:href="@{/movies}" class="btn btn-secondary btn-lg px-4 me-md-2 shadow-sm">Скасувати</a>
                        <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">Зберегти</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
